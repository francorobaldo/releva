name: Armar APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Copiar la app al APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html android/app/src/main/assets/www/index.html
          cp -r icons android/app/src/main/assets/www/ || true
      - name: Compilar
        id: build
        continue-on-error: true
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee ../build.log
      - name: Guardar registro de la compilación
        if: always()
        run: |
          mkdir -p /tmp/logs && cp build.log /tmp/logs/ 2>/dev/null || echo "sin log" > /tmp/logs/build.log
          echo "${{ steps.build.outcome }} run=${{ github.run_number }} sha=${{ github.sha }}" > /tmp/logs/status.txt
          cd /tmp/logs && git init -q && git checkout -q -b ci-logs && git add . \
            && git -c user.name=ci -c user.email=ci@releva.app commit -qm "log ${{ github.run_number }}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
      - name: Publicar APK
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Releva.apk
          gh release delete ultima -y --cleanup-tag || true
          gh release create ultima Releva.apk --title "Releva · versión ${{ github.run_number }}" \
            --notes "Descargá Releva.apk desde el celular y abrilo para instalar o actualizar. Tus relevamientos quedan guardados en el teléfono."
      - name: Fallar si no compiló
        if: steps.build.outcome != 'success'
        run: exit 1
